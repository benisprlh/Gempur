name: Build signed release candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release-signing
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Run security and rules tests
        run: node --test server/test/*.test.mjs tools/rules.test.mjs
      - name: Build a signed candidate without publishing
        env:
          GEMPUR_UPLOAD_KEYSTORE_BASE64: ${{ secrets.GEMPUR_UPLOAD_KEYSTORE_BASE64 }}
          GEMPUR_UPLOAD_STORE_PASSWORD: ${{ secrets.GEMPUR_UPLOAD_STORE_PASSWORD }}
          GEMPUR_UPLOAD_KEY_ALIAS: ${{ secrets.GEMPUR_UPLOAD_KEY_ALIAS }}
          GEMPUR_UPLOAD_KEY_PASSWORD: ${{ secrets.GEMPUR_UPLOAD_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GEMPUR_UPLOAD_KEYSTORE_BASE64"
          test -n "$GEMPUR_UPLOAD_STORE_PASSWORD"
          test -n "$GEMPUR_UPLOAD_KEY_ALIAS"
          test -n "$GEMPUR_UPLOAD_KEY_PASSWORD"
          export GEMPUR_UPLOAD_STORE_FILE="$RUNNER_TEMP/gempur-upload.jks"
          trap 'rm -f "$GEMPUR_UPLOAD_STORE_FILE"' EXIT
          umask 077
          printf '%s' "$GEMPUR_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$GEMPUR_UPLOAD_STORE_FILE"
          gradle -p android --no-daemon :engine:test :app:testDebugUnitTest :app:lintRelease :app:bundleRelease
          jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab
          sha256sum android/app/build/outputs/bundle/release/app-release.aab > android/app/build/outputs/bundle/release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: gempur-signed-candidate-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/bundle/release/SHA256SUMS.txt
