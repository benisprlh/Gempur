name: Build and test Gempur

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  companion:
    name: Companion API and security tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run server tests
        working-directory: server
        run: node --test

  android:
    name: Android checks, debug APK and unsigned AAB
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install supported SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Test, lint and build
        working-directory: android
        run: gradle --no-daemon --stacktrace :engine:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:bundleRelease
      - name: Write build checksums
        run: |
          mkdir -p build-evidence
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          paths = sorted(Path('android/app/build/outputs').rglob('*.apk')) + sorted(Path('android/app/build/outputs').rglob('*.aab'))
          if not paths:
              raise SystemExit('No APK/AAB was generated')
          out = ''.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.as_posix()}\n' for p in paths)
          Path('build-evidence/SHA256SUMS.txt').write_text(out)
          Path('build-evidence/README.txt').write_text('Debug APK is for development testing. Release AAB is unsigned unless an authorized signing configuration was explicitly provided. Neither artifact proves physical-device validation or Play approval.\n')
          PY
      - name: Upload development build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gempur-development-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
            build-evidence/
      - name: Upload test and lint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gempur-test-evidence-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            android/engine/build/reports/tests/
            android/engine/build/test-results/
            android/app/build/reports/
            android/app/build/test-results/

  emulator:
    name: Android emulator smoke and VPN fixture
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          working-directory: android
          script: gradle --no-daemon :app:connectedDebugAndroidTest
      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gempur-emulator-evidence-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/

